name: Release

# Merging (pushing) to the release branch tags v{package.json version} and
# publishes to npm. Re-pushing the same version is a no-op (tag already exists).
#
# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The
# trusted publisher must be configured on npmjs.com for this package:
#   repo gtbl2012/react-native-dev-router, workflow release.yml, no environment.
on:
  push:
    branches: [release]

permissions:
  contents: write # push tag / create GitHub Release
  id-token: write # mint the OIDC token npm exchanges for publish credentials

jobs:
  # Universal (arm64 + x86_64) build of glimpseui's menu bar binary, bundled
  # into the npm package so users without Xcode CLT still get the ⚛ indicator.
  # glimpseui is pinned exactly in package.json — bumping it rebuilds this
  # automatically, but check the JS<->binary protocol still matches.
  build-glimpse:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Build universal glimpse binary
        run: |
          SRC=node_modules/glimpseui/src/glimpse.swift
          swiftc -O -target arm64-apple-macos12 "$SRC" -o glimpse-arm64
          swiftc -O -target x86_64-apple-macos12 "$SRC" -o glimpse-x64
          mkdir -p native
          lipo -create -output native/glimpse glimpse-arm64 glimpse-x64
          lipo -archs native/glimpse

      - uses: actions/upload-artifact@v4
        with:
          name: glimpse-universal
          path: native/glimpse
          if-no-files-found: error

  release:
    needs: build-glimpse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so existing tags are visible

      - uses: actions/download-artifact@v4
        with:
          name: glimpse-universal
          path: native

      # upload-artifact strips the executable bit; restore it before packing.
      - run: chmod 755 native/glimpse

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      # --ignore-scripts skips glimpseui's native postinstall build (not needed
      # to compile/publish this package); our own build runs explicitly below.
      - run: npm ci --ignore-scripts

      - run: npm run check

      - run: npm run build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether v${{ steps.version.outputs.version }} already exists
        id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — bump the version in package.json to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing)
        if: steps.tag.outputs.exists == 'false'
        run: npm publish --access public

      # Tag only after a successful publish so a failed publish can be retried
      # by re-running the workflow.
      - name: Tag and create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
